<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration &amp; Result Portal</title>

<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Custom styles -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-dark">
  <div class="container">
    <span class="navbar-brand mb-0">📘 Student Registration &amp; Result Portal</span>
  </div>
</nav>

<div class="container my-4">

  <div class="row g-4">

    <!-- Registration Form -->
    <div class="col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title mb-3">Register Student</h5>

          <form id="regForm" novalidate>

            <!-- Personal details -->
            <div class="mb-3">
              <label for="studentName" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="studentName" required>
              <div class="invalid-feedback">Please enter the student's name.</div>
            </div>

            <div class="mb-3">
              <label for="rollNo" class="form-label">Roll Number</label>
              <input type="text" class="form-control" id="rollNo" required>
              <div class="invalid-feedback">Please enter a roll number.</div>
            </div>

            <div class="mb-3">
              <label for="course" class="form-label">Course</label>
              <select class="form-select" id="course" required>
                <option value="" selected disabled>Choose a course...</option>
                <option value="science">Science</option>
                <option value="commerce">Commerce</option>
                <option value="arts">Arts</option>
              </select>
              <div class="invalid-feedback">Please select a course.</div>
            </div>

            <!-- Subjects + marks (populated by JS based on course) -->
            <div id="subjectsContainer" class="mb-3"></div>

            <button type="submit" class="btn btn-primary w-100">Calculate &amp; Add Result</button>
          </form>

          <div id="formAlert" class="alert alert-danger mt-3 d-none" role="alert"></div>
        </div>
      </div>
    </div>

    <!-- Result summary + table -->
    <div class="col-lg-7">

      <div class="card shadow-sm mb-4 d-none" id="latestResultCard">
        <div class="card-body">
          <h5 class="card-title">Latest Result</h5>
          <p class="mb-1"><strong id="latestName"></strong> — <span id="latestCourse"></span></p>
          <p class="mb-1">Total: <span id="latestTotal"></span> / <span id="latestMax"></span></p>
          <p class="mb-1">Percentage: <span id="latestPercentage"></span>%</p>
          <span class="badge" id="latestStatus"></span>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title mb-3">All Registered Students</h5>
          <div class="table-responsive">
            <table class="table table-striped align-middle" id="resultsTable">
              <thead>
                <tr>
                  <th>Roll No</th>
                  <th>Name</th>
                  <th>Course</th>
                  <th>Total</th>
                  <th>%</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="resultsTableBody">
                <tr id="emptyRow">
                  <td colspan="6" class="text-center text-muted py-4">No students registered yet.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Bootstrap JS bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
